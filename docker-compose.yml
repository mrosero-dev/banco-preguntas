name: banco-preguntas
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: banco-preguntas-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-banco}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-banco_dev_2026}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: banco-preguntas-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.4
    container_name: banco-preguntas-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_2026}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/banco-preguntas-realm.json:/opt/keycloak/data/import/banco-preguntas-realm.json:ro
      - keycloak_data:/opt/keycloak/data

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: identity-service }
    container_name: banco-preguntas-identity
    environment:
      DB_URL: jdbc:h2:file:/data/identitydb;DB_CLOSE_ON_EXIT=FALSE
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/banco-preguntas
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/banco-preguntas/protocol/openid-connect/certs
    ports: ["8081:8081"]
    volumes: ["identity_data:/data"]
    depends_on: { keycloak: { condition: service_started } }
    restart: unless-stopped

  question-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: question-service }
    container_name: banco-preguntas-question
    environment:
      DB_URL: jdbc:h2:file:/data/questiondb;DB_CLOSE_ON_EXIT=FALSE
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/banco-preguntas
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/banco-preguntas/protocol/openid-connect/certs
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-banco}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-banco_dev_2026}
    ports: ["8080:8080"]
    volumes: ["question_data:/data"]
    depends_on: { rabbitmq: { condition: service_healthy }, keycloak: { condition: service_started } }
    restart: unless-stopped

  review-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: review-service }
    container_name: banco-preguntas-review
    environment:
      DB_URL: jdbc:h2:file:/data/reviewdb;DB_CLOSE_ON_EXIT=FALSE
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/banco-preguntas
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/banco-preguntas/protocol/openid-connect/certs
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-banco}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-banco_dev_2026}
    ports: ["8082:8082"]
    volumes: ["review_data:/data"]
    depends_on: { rabbitmq: { condition: service_healthy }, keycloak: { condition: service_started } }
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: notification-service }
    container_name: banco-preguntas-notification
    environment:
      DB_URL: jdbc:h2:file:/data/notificationdb;DB_CLOSE_ON_EXIT=FALSE
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/banco-preguntas
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/banco-preguntas/protocol/openid-connect/certs
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-banco}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-banco_dev_2026}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/banco-preguntas/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: notification-service
      KEYCLOAK_CLIENT_SECRET: notification-service-secret-dev
      NOTIFICATION_EMAIL_MODE: smtp
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: "1025"
    ports: ["8083:8083"]
    volumes: ["notification_data:/data"]
    depends_on: { rabbitmq: { condition: service_healthy }, identity-service: { condition: service_started }, keycloak: { condition: service_started }, mailhog: { condition: service_started } }
    restart: unless-stopped

volumes:
  rabbitmq_data:
  keycloak_data:
  identity_data:
  question_data:
  review_data:
  notification_data:
