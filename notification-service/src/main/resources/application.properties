spring.application.name=notification-service

# RabbitMQ connection
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:banco}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:banco_dev_2026}

# Server
server.port=8083

# H2 Database
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/notificationdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Correo: simulated (consola) o smtp (servidor SMTP real, MailHog en Docker Compose)
notification.email.mode=${NOTIFICATION_EMAIL_MODE:simulated}
notification.email.from=${NOTIFICATION_EMAIL_FROM:noreply@bancopreguntas.unicauca.edu.co}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:1025}

# Identity Service (REST) used to obtain the e-mail of each recipient
identity.service.url=${IDENTITY_SERVICE_URL:http://localhost:8081}

# Keycloak JWT resource server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/banco-preguntas}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/banco-preguntas/protocol/openid-connect/certs}

keycloak.token-url=${KEYCLOAK_TOKEN_URL:http://localhost:8180/realms/banco-preguntas/protocol/openid-connect/token}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:notification-service}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:notification-service-secret-dev}

# Reintentos acotados: un mensaje que falla se descarta tras 3 intentos
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
