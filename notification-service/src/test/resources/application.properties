app.security.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Este archivo reemplaza al application.properties principal durante las pruebas,
# por eso se repiten las propiedades que el contexto necesita.
identity.service.url=http://localhost:8081
keycloak.token-url=http://localhost:8180/realms/banco-preguntas/protocol/openid-connect/token
keycloak.client-id=notification-service
keycloak.client-secret=test-secret

# Sin RabbitMQ en las pruebas: los listeners no se inician.
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
